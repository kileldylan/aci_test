name: CI

on:
  pull_request:
    branches: [ "aci", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run basic check
        run: |
          echo "Running CI for KIL-8..."
          python -m compileall . 
          echo "Build successful!"