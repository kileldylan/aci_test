<!DOCTYPE html>
<html>
<head>
    <title>Choose a new password - ACI Test Project</title>
</head>
<body>
    {% if validlink %}
        <h1>Choose a new password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <p>
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </p>
            {% endfor %}
            <button type="submit">Change password</button>
        </form>
    {% else %}
        <h1>This reset link is invalid or has expired</h1>
        <p><a href="{% url 'auth_app:password_reset' %}">Request another reset link</a></p>
    {% endif %}
</body>
</html>
