<!DOCTYPE html>
<html>
<head>
    <title>Reset password - ACI Test Project</title>
</head>
<body>
    <h1>Reset your password</h1>
    <p>Enter the email address associated with your account. If it exists, we will email you a reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.email.errors }}
        <label for="{{ form.email.id_for_label }}">Email</label>
        {{ form.email }}
        <button type="submit">Send reset link</button>
    </form>
    <p><a href="{% url 'auth_app:login' %}">Back to login</a></p>
</body>
</html>
